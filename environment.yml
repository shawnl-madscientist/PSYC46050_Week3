name: mne-faa
channels:
  - conda-forge
dependencies:
  - python=3.14.0
  - pip
  # MNE and its required dependencies
  - mne>=1.10
  - numpy>=2.1,<3
  - scipy>=1.14
  - matplotlib>=3.9
  - decorator>=5.1
  - jinja2>=3.1
  - lazy-loader>=0.3
  - packaging
  - pooch>=1.5
  - tqdm>=4.66
  # Needed to run the notebook (and for mne's EDF reading, no extra package is required)
  - jupyterlab
  - ipykernel
